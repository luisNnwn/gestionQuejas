services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:?Define N8N_HOST in the server environment}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL:?Define WEBHOOK_URL in the server environment}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL:?Define WEBHOOK_URL in the server environment}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY in the server environment}
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/El_Salvador}
      TZ: ${GENERIC_TIMEZONE:-America/El_Salvador}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
